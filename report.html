<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📢 أداة الإبلاغ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0f19;--surface:#14161b;--accent:#00f2fe;--blue:#3b82f6;--text:#f8fafc;--sub:#94a3b8;--green:#10b981;--red:#ef4444}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}
        
        .container{max-width:500px;width:100%}
        .card{background:var(--surface);border:1px solid #222;border-radius:25px;padding:30px}
        .header{text-align:center;margin-bottom:25px}
        .header .icon{font-size:50px;margin-bottom:10px}
        .header h1{font-size:24px;font-weight:900;background:linear-gradient(90deg,#fff,#00f2fe,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        
        .form-group{margin-bottom:18px}
        .form-group label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:var(--sub)}
        .form-group input,.form-group select{width:100%;padding:14px;background:#1a1d24;border:1px solid #333;border-radius:15px;color:#fff;font-size:15px;font-weight:600;outline:none;font-family:'Cairo',sans-serif}
        .form-group input:focus{border-color:var(--accent)}
        
        .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:25px;font-size:16px;font-weight:700;cursor:pointer;border:none;width:100%;justify-content:center;transition:.3s;font-family:'Cairo',sans-serif}
        .btn-primary{background:linear-gradient(135deg,#ff4444,#ff6b6b);color:#fff}
        .btn-primary:active{transform:scale(.95)}
        
        .progress{display:none;margin-top:20px;text-align:center}
        .progress .bar{background:#1a1d24;border-radius:20px;height:20px;overflow:hidden;margin-bottom:10px}
        .progress .fill{height:100%;background:linear-gradient(90deg,#ff4444,#ff6b6b);border-radius:20px;transition:.3s;width:0%}
        .progress .status{font-size:14px;font-weight:600}
        
        .result{display:none;margin-top:20px;padding:15px;border-radius:15px;text-align:center;font-size:16px;font-weight:700}
        .result.success{background:rgba(16,185,129,.1);color:var(--green);border:1px solid var(--green)}
        .result.banned{background:rgba(16,185,129,.2);color:#fff;border:2px solid var(--green);font-size:18px}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div class="icon">🚨</div>
            <h1>أداة الإبلاغ</h1>
            <p style="color:var(--sub);font-size:13px;margin-top:5px">إبلاغ عن محتوى مخالف</p>
        </div>
        
        <div class="form-group">
            <label>🔗 رابط المنشور أو ID</label>
            <input type="text" id="postId" placeholder="مثال: 3607726316047547">
        </div>
        
        <div class="form-group">
            <label>🔢 عدد البلاغات</label>
            <input type="number" id="count" placeholder="10" value="10">
        </div>
        
        <div class="form-group">
            <label>📋 سبب الإبلاغ</label>
            <select id="reason">
                <option value="privacy">🔒 انتهاك خصوصية</option>
                <option value="spam">📢 سبام</option>
                <option value="offensive">🚫 محتوى مسيء</option>
                <option value="violence">⚔️ عنف</option>
                <option value="harassment">📵 مضايقة</option>
            </select>
        </div>
        
        <button class="btn btn-primary" onclick="startReport()"><i class="fa-solid fa-bullhorn"></i> بدء الإبلاغ</button>
        
        <div class="progress" id="progress">
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div class="status" id="status"></div>
        </div>
        
        <div class="result" id="result"></div>
    </div>
</div>

<script>
const API = 'https://orange-api-theta.vercel.app/api/report';

async function startReport() {
    const postId = document.getElementById('postId').value.trim();
    const count = parseInt(document.getElementById('count').value);
    const reason = document.getElementById('reason').value;
    
    if (!postId) { alert('اكتب ID المنشور'); return; }
    if (!count || count < 1) { alert('اكتب عدد صحيح'); return; }
    
    document.getElementById('progress').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    
    let success = 0;
    let banned = false;
    
    for (let i = 0; i < count; i++) {
        try {
            const response = await fetch(`${API}?post_id=${postId}&reason=${reason}`, {
                method: 'GET',
                timeout: 10000
            });
            
            if (response.ok) {
                success++;
                const data = await response.json();
                if (data.banned) {
                    banned = true;
                    break;
                }
            }
            
            const percent = Math.round(((i + 1) / count) * 100);
            document.getElementById('fill').style.width = percent + '%';
            document.getElementById('status').textContent = `✅ ${i + 1}/${count} بلاغ`;
            
            await new Promise(r => setTimeout(r, 500));
        } catch(e) {
            document.getElementById('status').textContent = `❌ خطأ في ${i + 1}`;
        }
    }
    
    document.getElementById('progress').style.display = 'none';
    const result = document.getElementById('result');
    result.style.display = 'block';
    
    if (banned) {
        result.className = 'result banned';
        result.textContent = '🎉 تم حظر المنشور!';
    } else {
        result.className = 'result success';
        result.textContent = `✅ تم ${success}/${count} بلاغ`;
    }
}
</script>
</body>
</html>
